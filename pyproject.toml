[project]
name = "gpu-bench"
version = "0.1.0"
description = "GPU performance benchmarks in Python and CUDA C."
readme = "README.md"
license = "Apache-2.0"
# Colab runs 3.13; the desktop is pinned to 3.13 too, so both sides match.
requires-python = ">=3.13"
dependencies = []

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import bench/ and telemetry/ from the repository root.
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
